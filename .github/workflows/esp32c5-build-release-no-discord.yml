name: JanOS Rebuild Release (No Discord)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to upload assets to a release (example 'janos-v1.2.3')"
        required: false
      labc5_tag:
        description: "Optional tag name for Lab_C5 FAP release (example 'labc5-v1.6.0')"
        required: false
      flipperlight_tag:
        description: "Optional tag name for FlipperLight FAP release (example 'flipperlight-v0.0.1')"
        required: false

defaults:
  run:
    shell: bash

jobs:
  firmware:
    name: JanOS
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.0-beta1
    outputs:
      fw_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache ESP-IDF artifacts
        uses: actions/cache@v5
        with:
          path: /root/.espressif
          key: espidf-6.0-${{ runner.os }}-${{ hashFiles('JanOS/sdkconfig', 'JanOS/dependencies.lock') }}
          restore-keys: |
            espidf-6.0-${{ runner.os }}-
            espidf-6.0-

      - name: Build JanOS (IDF 6.0)
        run: IDF_PY_FLAGS="--preview" bash .github/scripts/container_build.sh --no-docker

      - name: Stamp JanOS with JANOS_VERSION
        id: version
        run: |
          set -e
          version=$(python - <<'PY'
          from pathlib import Path
          import re
          text = Path("JanOS/main/main.c").read_text()
          m = re.search(r'JANOS_VERSION\s*"([^"]+)"', text)
          if not m:
              raise SystemExit("JANOS_VERSION not found")
          print(m.group(1))
          PY
          )
          src="JanOS/binaries-esp32c5/projectZero.bin"
          dst="JanOS/binaries-esp32c5/projectZero-${version}.bin"
          if [ ! -f "$src" ]; then
            echo "Missing firmware: $src" >&2
            exit 1
          fi
          cp "$src" "$dst"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_asset=${dst}" >> "$GITHUB_OUTPUT"

      - name: Package JanOS zip
        id: bundle
        run: |
          set -e
          cd JanOS/binaries-esp32c5
          out="projectZero-${{ steps.version.outputs.version }}.zip"
          rm -f "$out"
          zip -9 "$out" \
            bootloader.bin \
            partition-table.bin \
            flash_board.py \
            oui_wifi.bin \
            "projectZero-${{ steps.version.outputs.version }}.bin" \
            projectZero.bin
          echo "bundle_zip=$(pwd)/$out" >> "$GITHUB_OUTPUT"

      - name: Upload JanOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: esp32c5-firmware
          path: JanOS/binaries-esp32c5
          if-no-files-found: error

  fap:
    name: Flipper Apps
    runs-on: ubuntu-24.04
    outputs:
      fap_version: ${{ steps.fap_version.outputs.fap_version }}
      light_version: ${{ steps.light_version.outputs.light_version }}
      light_appid: ${{ steps.light_version.outputs.light_appid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FAP build dependencies (ufbt in venv)
        run: |
          set -e
          if command -v sudo >/dev/null 2>&1; then
            apt_prefix=(sudo)
          else
            apt_prefix=()
          fi
          "${apt_prefix[@]}" apt-get update
          "${apt_prefix[@]}" apt-get install -y python3-venv
          python3 -m venv /tmp/ufbt-venv
          . /tmp/ufbt-venv/bin/activate
          pip install -U pip ufbt
          echo "/tmp/ufbt-venv/bin" >> $GITHUB_PATH

      - name: Download Flipper SDKs
        run: |
          set -e
          mkdir -p FLIPPER/sdk
          cd FLIPPER/sdk
          [ -f flipper-z-f7-sdk-unlshd-083.zip ] || curl -L -o flipper-z-f7-sdk-unlshd-083.zip https://github.com/DarkFlippers/unleashed-firmware/releases/download/unlshd-083/flipper-z-f7-sdk-unlshd-083.zip
          [ -f flipper-z-f7-sdk-mntm-011.zip ] || curl -L -o flipper-z-f7-sdk-mntm-011.zip https://github.com/Next-Flip/Momentum-Firmware/releases/download/mntm-011/flipper-z-f7-sdk-mntm-011.zip
          [ -f flipper-z-f7-sdk-mntm-dev-22408e4c.zip ] || curl -L -o flipper-z-f7-sdk-mntm-dev-22408e4c.zip https://up.momentum-fw.dev/builds/firmware/dev/flipper-z-f7-sdk-mntm-dev-22408e4c.zip

      - name: Build Lab_C5 FAP
        run: |
          set -e
          python FLIPPER/build_fap.py --no-upload

      - name: Build FlipperLight FAP
        run: |
          set -e
          python FlipperLight/build_fap.py --sdk-dir FLIPPER/sdk --no-upload

      - name: Read FAP version
        id: fap_version
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          text = Path("FLIPPER/Lab_C5.c").read_text(encoding="utf-8", errors="ignore")
          m = re.search(r'#define\s+LAB_C5_VERSION_TEXT\s+"([^"]+)"', text)
          if not m:
            raise SystemExit("LAB_C5_VERSION_TEXT not found")

          version = m.group(1)
          print(f"fap_version={version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"fap_version={version}\n")
          PY

      - name: Read FlipperLight version
        id: light_version
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          text = Path("FlipperLight/application.fam").read_text(encoding="utf-8", errors="ignore")
          appid = re.search(r'appid="([^"]+)"', text)
          version = re.search(r'fap_version="([^"]+)"', text)
          if not appid:
            raise SystemExit("FlipperLight appid not found")
          if not version:
            raise SystemExit("FlipperLight fap_version not found")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"light_appid={appid.group(1)}\n")
            fh.write(f"light_version={version.group(1)}\n")
          PY

      - name: Upload Lab_C5 artifacts
        if: ${{ hashFiles('FLIPPER/dist/*.fap') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: labc5-fap
          path: FLIPPER/dist/*.fap
          if-no-files-found: error

      - name: Upload FlipperLight artifacts
        if: ${{ hashFiles('FlipperLight/dist/*.fap') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: flipperlight-fap
          path: FlipperLight/dist/*.fap
          if-no-files-found: error

  release:
    name: Release JanOS
    needs: [firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download JanOS artifacts
        uses: actions/download-artifact@v6
        with:
          name: esp32c5-firmware
          path: release_artifacts/firmware

      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FW_VERSION: ${{ needs.firmware.outputs.fw_version }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || format('janos-v{0}', needs.firmware.outputs.fw_version) }}
        run: |
          set -euo pipefail
          notes_file="release_notes.md"
          TAG="$(printf '%s' "${RELEASE_TAG:-janos-v${FW_VERSION}}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$TAG" ]; then TAG="janos-v${FW_VERSION}"; fi
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          JANOS_ZIP="$BASE_URL/projectZero-${FW_VERSION}.zip"
          RELEASE_PAGE="https://github.com/$REPO/releases/tag/$TAG"
          PAGES_LINK="https://${REPO%/*}.github.io/${REPO#*/}/"

          {
            printf '%s\n\n' "Release ${TAG} published."
            printf '%s\n' "Release page: ${RELEASE_PAGE}"
            printf '%s\n' "Web flasher: ${PAGES_LINK}"
            printf '%s\n' "JanOS (${FW_VERSION}): ${JANOS_ZIP}"
          } > "$notes_file"

          if [ "${GITHUB_EVENT_NAME:-}" = "release" ]; then
            if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "${GITHUB_EVENT_PATH:-}" ]; then
              release_body="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH")"
              if [ -n "$(printf '%s' "$release_body" | tr -d '\r\n[:space:]')" ]; then
                printf '%s\n' "$release_body" >> "$notes_file"
              fi
            fi
            exit 0
          fi

          if command -v gh >/dev/null 2>&1; then
            api="/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
            pr_json="$(gh api -H "Accept: application/vnd.github+json" "$api" 2>/dev/null || echo '[]')"
            pr_title="$(printf '%s' "$pr_json" | jq -r '.[0].title // ""')"
            pr_body="$(printf '%s' "$pr_json" | jq -r '.[0].body // ""')"

            if [ -n "$(printf '%s' "$pr_body" | tr -d '\r\n[:space:]')" ]; then
              if [ -n "$pr_title" ]; then
                printf '%s\n\n' "$pr_title" >> "$notes_file"
              fi
              printf '%s\n' "$pr_body" >> "$notes_file"
              exit 0
            fi

            gen_json="$(gh api -X POST -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" 2>/dev/null || echo '')"
            gen_body="$(printf '%s' "$gen_json" | jq -r '.body // ""')"
            if [ -n "$(printf '%s' "$gen_body" | tr -d '\r\n[:space:]')" ]; then
              printf '%s\n' "$gen_body" >> "$notes_file"
            fi
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FW_VERSION: ${{ needs.firmware.outputs.fw_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || format('janos-v{0}', needs.firmware.outputs.fw_version) }}
        run: |
          set -euo pipefail
          TAG="$(printf '%s' "${RELEASE_TAG:-janos-v${FW_VERSION}}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$TAG" ]; then TAG="janos-v${FW_VERSION}"; fi
          NAME="JanOS ${FW_VERSION}"

          echo "Using release tag: '$TAG'"

          files=(
            release_artifacts/firmware/bootloader.bin
            release_artifacts/firmware/partition-table.bin
            release_artifacts/firmware/flash_board.py
            release_artifacts/firmware/oui_wifi.bin
            release_artifacts/firmware/projectZero.bin
            "release_artifacts/firmware/projectZero-${FW_VERSION}.bin"
            "release_artifacts/firmware/projectZero-${FW_VERSION}.zip"
          )

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$NAME" --notes-file release_notes.md
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$NAME" --notes-file release_notes.md
          fi

          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

  labc5_release:
    name: Release Lab_C5 FAP
    needs: [fap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.labc5_tag }}
          FAP_VERSION: ${{ needs.fap.outputs.fap_version }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then TAG="labc5-v${FAP_VERSION}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download FAP artifacts
        uses: actions/download-artifact@v6
        with:
          name: labc5-fap
          path: release_artifacts/fap

      - name: Package Lab_C5 bundle
        env:
          FAP_VERSION: ${{ needs.fap.outputs.fap_version }}
        run: |
          set -euo pipefail
          cd release_artifacts/fap
          shopt -s nullglob
          files=(lab_c5_v"${FAP_VERSION}"_*.fap)
          if [ ${#files[@]} -eq 0 ]; then
            files=(lab_c5*.fap)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Lab_C5 FAPs found for version ${FAP_VERSION}" >&2
            exit 1
          fi
          zip -9 "lab_c5-${FAP_VERSION}-bundle.zip" "${files[@]}"

      - name: Build release notes
        env:
          FAP_VERSION: ${{ needs.fap.outputs.fap_version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/$REPO/releases/download/${RELEASE_TAG}"
          {
            printf '%s\n\n' "Release ${RELEASE_TAG} published."
            printf '%s\n' "Uploader: https://${REPO%/*}.github.io/${REPO#*/}/flipper_fap.html"
            printf '%s\n' "Bundle: ${BASE_URL}/lab_c5-${FAP_VERSION}-bundle.zip"
          } > release_notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAP_VERSION: ${{ needs.fap.outputs.fap_version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          NAME="Lab_C5 FAP ${FAP_VERSION}"
          shopt -s nullglob
          files=(release_artifacts/fap/lab_c5_v"${FAP_VERSION}"_*.fap)
          if [ ${#files[@]} -eq 0 ]; then
            files=(release_artifacts/fap/lab_c5*.fap)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Lab_C5 FAP release assets found for version ${FAP_VERSION}" >&2
            exit 1
          fi
          files+=("release_artifacts/fap/lab_c5-${FAP_VERSION}-bundle.zip")
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$NAME" --notes-file release_notes.md
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$NAME" --notes-file release_notes.md
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

  flipperlight_release:
    name: Release FlipperLight FAP
    needs: [fap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.flipperlight_tag }}
          LIGHT_VERSION: ${{ needs.fap.outputs.light_version }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then TAG="flipperlight-v${LIGHT_VERSION}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download FAP artifacts
        uses: actions/download-artifact@v6
        with:
          name: flipperlight-fap
          path: release_artifacts/fap

      - name: Package FlipperLight bundle
        env:
          LIGHT_VERSION: ${{ needs.fap.outputs.light_version }}
          LIGHT_APPID: ${{ needs.fap.outputs.light_appid }}
        run: |
          set -euo pipefail
          cd release_artifacts/fap
          shopt -s nullglob
          files=("${LIGHT_APPID}"_v"${LIGHT_VERSION}"_*.fap)
          if [ ${#files[@]} -eq 0 ]; then
            files=("${LIGHT_APPID}"*.fap)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No FlipperLight FAPs found for ${LIGHT_APPID} ${LIGHT_VERSION}" >&2
            exit 1
          fi
          zip -9 "flipperlight-${LIGHT_VERSION}-bundle.zip" "${files[@]}"

      - name: Build release notes
        env:
          LIGHT_VERSION: ${{ needs.fap.outputs.light_version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/$REPO/releases/download/${RELEASE_TAG}"
          {
            printf '%s\n\n' "Release ${RELEASE_TAG} published."
            printf '%s\n' "Bundle: ${BASE_URL}/flipperlight-${LIGHT_VERSION}-bundle.zip"
          } > release_notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIGHT_VERSION: ${{ needs.fap.outputs.light_version }}
          LIGHT_APPID: ${{ needs.fap.outputs.light_appid }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          NAME="FlipperLight FAP ${LIGHT_VERSION}"
          shopt -s nullglob
          files=(release_artifacts/fap/"${LIGHT_APPID}"_v"${LIGHT_VERSION}"_*.fap)
          if [ ${#files[@]} -eq 0 ]; then
            files=(release_artifacts/fap/"${LIGHT_APPID}"*.fap)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No FlipperLight FAP release assets found for ${LIGHT_APPID} ${LIGHT_VERSION}" >&2
            exit 1
          fi
          files+=("release_artifacts/fap/flipperlight-${LIGHT_VERSION}-bundle.zip")
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$NAME" --notes-file release_notes.md
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$NAME" --notes-file release_notes.md
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

